name: release-latest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build distribution
        shell: pwsh
        run: .\build.ps1

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath .\DKImageSimpleUpscaler-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKImageSimpleUpscaler-win-x64
          path: |
            dist/DKImageSimpleUpscaler.exe
            dist/DKImageSimpleUpscaler.App.exe
            DKImageSimpleUpscaler-win-x64.zip

      - name: Remove previous latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo ${{ github.repository }} --yes --cleanup-tag

      - name: Create latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\DKImageSimpleUpscaler.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Project version could not be read.'
          }

          gh release create latest `
            .\DKImageSimpleUpscaler-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "DK Image Simple Upscaler $version - Latest" `
            --prerelease `
            --notes "Windows x64 portable package. Uses a native launcher that checks for Microsoft .NET 8 Desktop Runtime (x64), then starts the framework-dependent single-file app. AI engine installation remains on-demand."
