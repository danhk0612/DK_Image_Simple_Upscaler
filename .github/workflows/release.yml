name: release-latest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet restore .\DKImageSimpleUpscaler.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish .\DKImageSimpleUpscaler.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path .\dist\* -DestinationPath .\DKImageSimpleUpscaler-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKImageSimpleUpscaler-win-x64
          path: |
            dist/DKImageSimpleUpscaler.exe
            DKImageSimpleUpscaler-win-x64.zip

      - name: Remove previous latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo ${{ github.repository }} --yes --cleanup-tag

      - name: Create latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create latest `
            .\dist\DKImageSimpleUpscaler.exe `
            .\DKImageSimpleUpscaler-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "DK Image Simple Upscaler 0.3.0 - Latest" `
            --prerelease `
            --notes "Automatic Windows x64 build from main. Includes the responsive toolbar UI, GPU selection, and synchronized zoom/pan preview."
